services:
  postgres:
    image: postgres:17-alpine
    container_name: unyowo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unyowo
      POSTGRES_PASSWORD: unyowo
      POSTGRES_DB: unyowo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unyowo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
