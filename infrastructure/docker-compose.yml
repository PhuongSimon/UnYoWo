services:
  postgres:
    image: postgres:17-alpine
    container_name: unyowo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unyowo
      POSTGRES_PASSWORD: unyowo
      POSTGRES_DB: unyowo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unyowo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: unyowo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Optional self-hosted translator: `pnpm translate:up`, then LIBRETRANSLATE_URL=http://localhost:5000
  # The first start downloads the language models (a few minutes, ~1 GB).
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: unyowo-libretranslate
    restart: unless-stopped
    profiles: ["translate"]
    environment:
      LT_LOAD_ONLY: en,vi,de,ja,ko
    ports:
      - "5000:5000"
    volumes:
      - libretranslate-models:/home/libretranslate/.local

volumes:
  pgdata:
  libretranslate-models:
